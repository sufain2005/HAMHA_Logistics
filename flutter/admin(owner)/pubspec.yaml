name: admin_dashboard
description: "HAMHA Logistics — Owner & Admin Centralized Fleet Control Tower."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  
  # State & Local Persistence
  flutter_secure_storage: ^11.2.0

  # Networking & Real-Time Sockets
  http: ^1.6.0
  socket_io_client: ^3.1.6

  # Mapping & Geolocation
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

  # Formatting & Fonts
  intl: ^0.20.3
  google_fonts: ^9.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
